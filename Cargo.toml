cargo-features = ["panic-immediate-abort"]

[workspace]
members = [
    "crates/engine-bench",
    "crates/engine-bench-core",
    "crates/engine-bench-physics",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
triple_buffer = { version = "9.0.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui_plot = { version = "0.38.0", default-features = false }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
polars = { version = "0.55.2", default-features = false, features = ["csv", "parquet"] }
uom = { version = "0.38.0", default-features = false, features = ["f64", "si", "std"] }

# dev-only
egui_kittest = { version = "0.37.0", default-features = false }
approx = { version = "0.5.1", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "immediate-abort"
rpath = false
strip = true

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = true
strip = false

# Benchmarks: release optimisations with unwinding. The libtest/criterion harness needs
# unwinding, and with `build-std` an `immediate-abort` std would be built alongside an
# unwinding one and clash. Run with `cargo bench --profile bench-unwind`.
[profile.bench-unwind]
inherits = "release"
panic = "unwind"
